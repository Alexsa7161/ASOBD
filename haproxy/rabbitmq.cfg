global
  daemon
  maxconn 4096
  log stdout local0

defaults
  mode tcp
  timeout connect 5s
  timeout client 50s
  timeout server 50s
  option tcp-check
  retries 3

listen rabbitmq-amqp
  bind *:5672
  balance roundrobin
  server rabbit1 clickstream-rabbitmq1:5672 check inter 2000 rise 2 fall 3
  server rabbit2 clickstream-rabbitmq2:5672 check inter 2000 rise 2 fall 3
  server rabbit3 clickstream-rabbitmq3:5672 check inter 2000 rise 2 fall 3

listen rabbitmq-mgmt
  bind *:15672
  mode http
  balance roundrobin
  server rabbit1 clickstream-rabbitmq1:15672 check
  server rabbit2 clickstream-rabbitmq2:15672 check
  server rabbit3 clickstream-rabbitmq3:15672 check


frontend rabbitmq-prometheus
  bind *:15692
  mode http
  default_backend rabbitmq-prometheus-backend

backend rabbitmq-prometheus-backend
  mode http
  balance roundrobin
  server rabbit1 clickstream-rabbitmq1:15692 check
  server rabbit2 clickstream-rabbitmq2:15692 check
  server rabbit3 clickstream-rabbitmq3:15692 check

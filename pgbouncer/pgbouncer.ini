[databases]
clickstream = host=postgres-master,postgres-replica dbname=clickstream user=clickstream password=clickstream
clickstream_write = host=postgres-master dbname=clickstream user=clickstream password=clickstream

[pgbouncer]
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
server_reset_query = DISCARD ALL
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
listen_addr = *
listen_port = 5432
ignore_startup_parameters = extra_float_digits
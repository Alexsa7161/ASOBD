global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: clickhouse
    static_configs:
      - targets: ['clickhouse:9363']
  - job_name: 'rabbitmq'
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['clickstream-rabbitmq:15692']
    basic_auth:
      username: clickstream
      password: clickstream